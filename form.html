<html>
    <head> form in HTML</head>
        <body>
            
            <div>
                <h1> FORM in HTML </h1>
                <form>
                <table border="6 pxl">
                   <tr>
                    <th>Lables</th>
                     <th>Input Data</th>
                   </tr> 
                   <tr>
                    <td>first name:</td>
                    <td><input type="name" placeholder="Enter your first name"></td>
                    </tr>
                    <tr>
                        <td>Last Name:</td>
                        <td><input type="name" placeholder="Enter your last name"</td>
                    </tr>
                    <tr>
                        <td>Age:</td>
                        <td><input type="number" placeholder="Enter your age"</td>
                   </tr>
                   <tr>
                    <td>Password:</td>
                    <td><input type="pwd" placeholder="Enter your Password"</td>
                   </tr>
                   <tr>
                    <td>Gender</td>
                    <td><input type="radio" name="gender" value="male"/>male<br/>
                    <input type="radio" name="gender" value="Female"/>Female<br/>
                    <input type="radio" name="gender" value="Others"/>Others<br/>
                </td>
                   </tr>
                   <form action="">
                   <tr>
                    
                    <td>Stream:</td>

                    <td><select>
                        <option value="science">Science</option>
                    <option value="Management">Management</option>
                <option value="Education">Education</option>
                </select></td>
                   </tr>
                   <form action="">
                   <tr>
                    <td>Submit</td>
                    <td><input type="submit" value="Submit"/></td>
                   </tr>
                   </form>
                </table>
                </form>
            </div>

        </body>
    
</html>
